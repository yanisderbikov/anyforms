<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>Код для входа в админку</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap');
        body { margin:0; padding:0; }
        .display { font-family:'Oswald','Golos Text',Arial,Helvetica,sans-serif; }
        .body-font { font-family:'Golos Text',Arial,Helvetica,sans-serif; }
        @media (max-width:600px){
            .card { width:100% !important; }
            .pad { padding-left:24px !important; padding-right:24px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#f1f0ec; font-family:'Golos Text',Arial,Helvetica,sans-serif; color:#3e4c5d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f0ec; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" class="card" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px; background-color:#ffffff; border-radius:20px; overflow:hidden;">
                <tr>
                    <td class="pad" style="background-color:#ffffff; padding:36px 40px 0 40px;">
                        <span class="body-font" style="display:inline-block; font-family:'Golos Text',Arial,sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase; background-color:#f2ed6f; color:#3a4859; padding:7px 13px; border-radius:8px;">Вход в админку</span>
                    </td>
                </tr>
                <tr>
                    <td class="pad" style="padding:20px 40px 0 40px;">
                        <h1 class="display" style="margin:0; font-family:'Oswald',Arial,sans-serif; font-weight:700; font-size:32px; line-height:1.1; letter-spacing:0.5px; text-transform:uppercase; color:#3e4c5d;">Ваш код</h1>
                    </td>
                </tr>
                <tr>
                    <td class="pad body-font" style="padding:16px 40px 24px 40px; font-size:16px; line-height:1.65; color:#5c6775;">
                        Введите этот код на странице входа. Он действует %TTL%&nbsp;минут и работает один раз.
                    </td>
                </tr>
                <tr>
                    <td class="pad" style="padding:0 40px 28px 40px;">
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td class="display" style="background-color:#3a4859; border-radius:14px; padding:18px 34px; font-family:'Oswald',Arial,sans-serif; font-size:34px; font-weight:700; letter-spacing:10px; color:#f1f0ec;">%CODE%</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="pad body-font" style="padding:0 40px 32px 40px; font-size:14px; line-height:1.6; color:#5c6775;">
                        Если вы не запрашивали вход, просто проигнорируйте это письмо — без кода войти нельзя.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:28px 40px 36px 40px; border-top:1px solid #e5e3dc;">
                        <img src="https://storage.yandexcloud.net/anyforms/3d-print/email/logoayforms.jpg" alt="anyforms" width="150" style="display:inline-block; width:150px; height:auto; border:0; outline:none; text-decoration:none;">
                    </td>
                </tr>
            </table>
            <table role="presentation" width="560" class="card" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px;">
                <tr>
                    <td class="body-font" style="padding:20px 40px 24px 40px; font-size:12px; color:#9aa0a8; text-align:center;">
                        © anyforms · <a href="https://anyforms.ru" style="color:#9aa0a8; text-decoration:underline;">anyforms.ru</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
